[workspace]
resolver = "2"
members = ["crates/planner-core", "crates/planner-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
planner-core = { path = "crates/planner-core", version = "0.1.0" }
eframe = { version = "=0.36.2", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = "=0.36.2"
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
opt-level = 2
lto = "thin"
